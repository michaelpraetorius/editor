<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Pipeline Editor v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <!-- Libs als UMD-Globals (window.Konva / window.jspdf), lokal vendored, vor den Modulen -->
  <script src="./vendor/konva.min.js"></script>
  <script src="./vendor/jspdf.umd.min.js"></script>
</head>
<body>
  <!-- erzwingt Font-Download vor Canvas-Textsatz -->
  <div class="font-preload" aria-hidden="true">
    <span style="font-family:'Space Grotesk';font-weight:700">.</span>
    <span style="font-family:'Inter';font-weight:400">.</span>
    <span style="font-family:'Inter';font-weight:600">.</span>
  </div>

  <div class="app">
    <!-- TOOLBAR -->
    <header class="toolbar">
      <div class="group">
        <button id="thumbsToggle" class="icon-btn" title="Seitenübersicht ein-/ausklappen" aria-label="Seitenübersicht">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
            <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/>
            <line x1="6" y1="2.5" x2="6" y2="13.5"/>
          </svg>
        </button>
        <div class="seg" id="formatBtns"></div>
      </div>
      <div class="group">
        <button id="safeBtn" class="icon-btn" title="Sicherheitszonen (Raster)" aria-label="Sicherheitszonen">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
            <rect x="1.5" y="1.5" width="13" height="13" rx="1.5"/>
            <line x1="1.5" y1="6" x2="14.5" y2="6"/><line x1="1.5" y1="10.5" x2="14.5" y2="10.5"/>
            <line x1="6" y1="1.5" x2="6" y2="14.5"/><line x1="10.5" y1="1.5" x2="10.5" y2="14.5"/>
          </svg>
        </button>
        <div class="menu-wrap">
          <button id="helpBtn" class="icon-btn" title="Hilfe" aria-label="Hilfe">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
              <circle cx="8" cy="8" r="6.5"/>
              <path d="M6.2 6.1a1.8 1.8 0 1 1 2.35 1.85c-.5.25-.9.65-.9 1.25v.25" stroke-linecap="round"/>
              <circle cx="8" cy="11.8" r=".55" fill="currentColor" stroke="none"/>
            </svg>
          </button>
          <div class="menu help-menu" id="helpMenu">
            <div class="help-line">Klick auf ein Element wählt es aus und verschiebt es.</div>
            <div class="help-line">Doppelklick öffnet das Tippen direkt im Layout.</div>
            <div class="help-line">Für die Textfarbe erst das Element wählen, dann die Farbe.</div>
          </div>
        </div>
      </div>
      <div class="group">
        <div class="menu-wrap">
          <button id="deckBtn">Deck ▾</button>
          <div class="menu" id="deckMenu">
            <button data-deck="import">Deck importieren …</button>
            <button data-deck="paste">Deck einfügen (Text) …</button>
            <button data-deck="link">Teilen-Link kopieren</button>
            <button data-deck="copy">deck.json kopieren</button>
          </div>
          <input type="file" id="deckFile" accept=".json,application/json" hidden />
        </div>
        <div class="menu-wrap">
          <button id="exportBtn" class="primary">Export ▾</button>
          <div class="menu" id="exportMenu">
            <button data-export="png">PNG · aktuelle Folie</button>
            <button data-export="png-all">PNG · alle Folien</button>
            <button data-export="pdf">PDF</button>
            <button data-export="mp4">Video</button>
          </div>
        </div>
      </div>
    </header>

    <!-- THUMBS -->
    <aside class="thumbs" id="thumbs"></aside>

    <!-- STAGE -->
    <main class="stage-area">
      <div class="stage-wrap"><div id="stage"></div></div>

      <!-- ASSET-LEISTE -->
      <div class="tray">
        <div class="picker">
          <button class="picker-btn" data-cat="background">Hintergrund <span class="caret">▾</span></button>
          <div class="picker-panel" id="panel-background"></div>
        </div>
        <div class="picker">
          <button class="picker-btn" data-cat="overlay">Overlay <span class="caret">▾</span></button>
          <div class="picker-panel" id="panel-overlay"></div>
        </div>
        <div class="picker">
          <button class="picker-btn" data-cat="artwork">Artwork <span class="caret">▾</span></button>
          <div class="picker-panel" id="panel-artwork"></div>
        </div>
        <div class="tray-group"><span class="tray-label">Textfarbe</span><div class="tray-row" id="trayText"></div></div>
      </div>

      <div class="transport">
        <button id="prevBtn">←</button>
        <button id="playBtn" class="play">▶</button>
        <input id="scrub" type="range" min="0" max="1000" value="0" />
        <span id="timeLabel" class="time">0.0 / 0.0s</span>
        <button id="nextBtn">→</button>
      </div>
    </main>
  </div>

  <!-- Export-Fortschritt -->
  <div class="progress" id="progress">
    <div class="progress-box">
      <div class="progress-txt" id="progressTxt">Export …</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </div>

  <!-- Deck einfügen (vom Agenten generiertes deck.json) -->
  <div class="modal" id="deckModal">
    <div class="modal-box">
      <div class="modal-title">Deck einfügen</div>
      <p class="modal-hint">deck.json des Agenten hier einfügen — die Vorschau wird sofort damit gefüllt.</p>
      <textarea id="deckPaste" spellcheck="false" placeholder='{ "meta": { … }, "slides": [ … ] }'></textarea>
      <div class="modal-actions">
        <button id="deckCancel">Abbrechen</button>
        <button id="deckLoad" class="primary">Laden</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
